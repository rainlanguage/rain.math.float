name: soldeer-package
on: [push]
jobs:
  soldeer-package:
    runs-on: ubuntu-latest
    steps:
      - uses: rainlanguage/rainix/.github/actions/nix-cachix-setup@main
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix develop -c bash script/check-soldeer-package.sh
