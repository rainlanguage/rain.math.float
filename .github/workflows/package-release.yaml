name: Package Release
on:
  push:
    branches:
      - main
jobs:
  release:
    uses: rainlanguage/rainix/.github/workflows/rainix-autopublish.yaml@main
    with:
      crate: rain-math-float
      npm-package: "@rainlanguage/float"
      soldeer-package: rain-math-float
    secrets: inherit
  release-float-macro:
    uses: rainlanguage/rainix/.github/workflows/rainix-autopublish.yaml@main
    with:
      crate: rain-math-float-macro
    secrets: inherit
  release-float-serde:
    uses: rainlanguage/rainix/.github/workflows/rainix-autopublish.yaml@main
    with:
      crate: rain-math-float-serde
    secrets: inherit
