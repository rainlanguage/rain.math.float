name: halmos
on:
  push:
  workflow_dispatch:
    inputs:
      lemma:
        description: Run only this lemma and its slices (all runs every lemma)
        type: choice
        default: all
        options:
          - all
          - quick
          - divhint
          - hints
          - pack
          - far
concurrency:
  # A push supersedes the previous push's run on its ref; dispatches never
  # cancel each other.
  group: halmos-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
env:
  HALMOS_VERSION: 0.3.3
  # Solver versions: yices 2.7.0, cvc5 1.4.0, bitwuzla 0.9.1.
  SOLVER_NIXPKGS: github:NixOS/nixpkgs/8edc0c72e3a38faf5434e40d1f19431125fe4b30
  # Every halmos run must prove in this many seconds; a slice that reaches it
  # fails and is cut smaller.
  HALMOS_RUN_SECONDS: 300
  # Foundry's nightly banner names FOUNDRY_DISABLE_NIGHTLY_WARNING, which the
  # WARNING check below would read as a halmos warning.
  FOUNDRY_DISABLE_NIGHTLY_WARNING: 1
defaults:
  run:
    shell: bash
jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      lemmas: ${{ steps.select.outputs.lemmas }}
    steps:
      - id: select
        env:
          LEMMA: ${{ inputs.lemma || 'all' }}
        # expect: tests the contract/function filter must match; a filter
        # that silently matches fewer fails the job.
        # A sliced lemma has `range`, its case indices, and `starts`: slice i
        # is [starts[i], starts[i + 1] - 1], the last one ending at range[1],
        # so the slices tile the range. Each slice runs with
        # HALMOS_SLICE_LO/HI (`LibHalmosExact.inSlice`), so its --function
        # filter must match that one lemma.
        run: |
          lemmas=$(jq -c --arg lemma "$LEMMA" '
            [.[]
             | select($lemma == "all" or .name == $lemma or (.name | startswith($lemma + "-")))
             | if has("starts") then
                 . as $l
                 | if ($l.starts[0] != $l.range[0]) or ($l.starts[-1] > $l.range[1])
                      or ([$l.starts | range(1; length) as $i | $l.starts[$i] > $l.starts[$i - 1]] | all | not)
                   then error("\($l.name): starts do not tile \($l.range)") else . end
                 | ($l.starts + [$l.range[1] + 1]) as $b
                 | range(0; $l.starts | length) as $i
                 | $l + {name: "\($l.name)-\($b[$i])-\($b[$i + 1] - 1)", lo: $b[$i], hi: ($b[$i + 1] - 1)}
                 | del(.starts, .range)
               else . end]' <<'JSON'
          [
            {"name": "quick", "solver": "bitwuzla", "expect": 3, "args": ["--contract", "AddSubRoundOnceHalmosTest", "--function", "check_(addZeroOperand|maximizeFloat|maximizeIdempotent)"]},
            {"name": "divhint", "solver": "bitwuzla", "expect": 1, "args": ["--contract", "LibHalmosExactHalmosTest", "--function", "check_divHintHolds"]},
            {"name": "hints", "solver": "yices", "expect": 1, "args": ["--contract", "LibHalmosExactHalmosTest", "--function", "check_maximizeHintsHold"], "range": [0, 76], "starts": [0, 10, 20, 30, 40, 50, 60, 70]},
            {"name": "pack-hints", "solver": "hybrid", "expect": 1, "args": ["--contract", "LibHalmosExactHalmosTest", "--function", "check_packHintsHold", "--solver-timeout-assertion", "0", "--solver-timeout-branching", "1s"], "range": [0, 76], "starts": [0, 72]},
            {"name": "pack-below", "solver": "hybrid", "expect": 1, "args": ["--contract", "PackArithmeticResultHalmosTest", "--function", "check_packBelow", "--solver-timeout-assertion", "0", "--solver-timeout-branching", "1s"]},
            {"name": "pack-low", "solver": "hybrid", "expect": 1, "args": ["--contract", "PackArithmeticResultHalmosTest", "--function", "check_packLow", "--solver-timeout-assertion", "0", "--solver-timeout-branching", "1s"], "range": [0, 857], "starts": [0, 22, 44, 66, 88, 110, 132, 154, 176, 198, 220, 242, 264, 286, 308, 330, 352, 374, 396, 418, 440, 462, 484, 506, 528, 550, 572, 594, 616, 638, 660, 682, 704, 726, 748, 770, 792, 814, 836]},
            {"name": "pack-middle", "solver": "hybrid", "expect": 1, "args": ["--contract", "PackArithmeticResultHalmosTest", "--function", "check_packMiddle", "--solver-timeout-assertion", "0", "--solver-timeout-branching", "1s"], "range": [0, 10], "starts": [0]},
            {"name": "pack-high", "solver": "hybrid", "expect": 1, "args": ["--contract", "PackArithmeticResultHalmosTest", "--function", "check_packHigh", "--solver-timeout-assertion", "0", "--solver-timeout-branching", "1s"], "range": [0, 857], "starts": [0, 22, 44, 66, 88, 110, 132, 154, 176, 198, 220, 242, 264, 286, 308, 330, 352, 374, 396, 418, 440, 462, 484, 506, 528, 550, 572, 594, 616, 638, 660, 682, 704, 726, 748, 770, 792, 814, 836]},
            {"name": "pack-above", "solver": "hybrid", "expect": 1, "args": ["--contract", "PackArithmeticResultHalmosTest", "--function", "check_packAbove", "--solver-timeout-assertion", "0", "--solver-timeout-branching", "1s"]},
            {"name": "far", "solver": "hybrid", "expect": 1, "args": ["--contract", "AddSubRoundOnceHalmosTest", "--function", "check_addFar", "--solver-timeout-branching", "2s", "--solver-timeout-assertion", "0"]}
          ]
          JSON
          )
          echo "lemmas=$lemmas" >> "$GITHUB_OUTPUT"
  halmos:
    needs: matrix
    name: halmos (${{ matrix.lemma.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lemma: ${{ fromJSON(needs.matrix.outputs.lemmas) }}
    steps:
      - uses: rainlanguage/rainix/.github/actions/nix-cachix-setup@main
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Install halmos and solvers
        run: |
          pipx install "halmos==$HALMOS_VERSION"
          for s in yices cvc5 bitwuzla; do
            echo "$(nix build --no-link --print-out-paths "$SOLVER_NIXPKGS#$s" | head -1)/bin" >> "$GITHUB_PATH"
          done
      - name: Install soldeer dependencies
        run: nix develop -c forge soldeer install
      # halmos's own build (same flags) is then a no-op inside the time limit.
      - name: Build
        run: nix develop -c forge build --ast --root . --extra-output storageLayout metadata
      - name: Run ${{ matrix.lemma.name }}
        env:
          SOLVER: ${{ matrix.lemma.solver }}
          EXPECT: ${{ matrix.lemma.expect }}
          ARGS_JSON: ${{ toJSON(matrix.lemma.args) }}
          SLICE_LO: ${{ matrix.lemma.lo }}
          SLICE_HI: ${{ matrix.lemma.hi }}
          LOG: halmos-${{ matrix.lemma.name }}.log
          PYTHONUNBUFFERED: 1
        run: |
          case "$SOLVER" in
            bitwuzla) solver="bitwuzla --produce-models" ;;
            yices) solver=yices-smt2 ;;
            hybrid) solver="$GITHUB_WORKSPACE/script/halmos/hybrid-solver.sh" ;;
          esac
          if [ -n "$SLICE_LO" ]; then
            export HALMOS_SLICE_LO="$SLICE_LO" HALMOS_SLICE_HI="$SLICE_HI"
          fi
          mapfile -t args < <(jq -r '.[]' <<<"$ARGS_JSON")
          start=$(date +%s)
          set +e
          # Into a file, not a pipe: solver processes outliving a killed
          # halmos would hold a pipe open past the limit.
          timeout -k 10 "$HALMOS_RUN_SECONDS" nix develop -c halmos --panic-error-codes '*' --solver-threads 4 --loop 16 \
            --solver-command "$solver" "${args[@]}" > "$LOG" 2>&1
          code=$?
          set -e
          cat "$LOG"
          seconds=$(($(date +%s) - start))
          echo "| ${{ matrix.lemma.name }} | exit $code | ${seconds}s |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" = 124 ] || [ "$code" = 137 ]; then
            echo "over ${HALMOS_RUN_SECONDS}s: cut this slice smaller"
            exit 1
          fi
          # halmos exits non-zero on any counterexample, timeout or error. A
          # warning (a loop bound reached, a path left unexplored) leaves the
          # proof incomplete.
          if grep -q WARNING "$LOG"; then
            echo "halmos warned: the proof is incomplete"
            exit 1
          fi
          passed=$(awk '/^Symbolic test result: [0-9]+ passed; 0 failed;/ { n += $4 } END { print n + 0 }' "$LOG")
          if [ "$code" != 0 ] || [ "$passed" != "$EXPECT" ]; then
            echo "exit $code; expected $EXPECT passing tests, got $passed"
            exit 1
          fi
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: halmos-${{ matrix.lemma.name }}
          path: halmos-${{ matrix.lemma.name }}.log
          if-no-files-found: warn
