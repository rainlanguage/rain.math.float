name: gas-snapshot
on: [push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: rainlanguage/rainix/.github/actions/nix-cachix-setup@main
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: bash script/check-gas-snapshot-test.sh
      - run: nix develop -c forge soldeer install
      - run: nix develop -c forge snapshot --fuzz-seed 0 --snap "$RUNNER_TEMP/fresh.gas-snapshot"
      - run: bash script/check-gas-snapshot.sh .gas-snapshot "$RUNNER_TEMP/fresh.gas-snapshot"
