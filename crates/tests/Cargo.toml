[package]
name = "rain-math-float-tests"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
homepage.workspace = true
description = "Tests of the library through the rain-math-float bindings, over concretes compiled from this source."

[dev-dependencies]
alloy = { version = "1.0.9", default-features = false, features = [
  "sol-types",
  "arbitrary",
] }
alloy-primitives = { version = "1.0.9", default-features = false }
proptest = "1.7.0"
num-bigint = "0.4.6"
num-integer = "0.1"
num-traits = "0.2.19"
serde_json = "1.0.140"
rain-math-float = { version = "0.1.12", features = ["test-harness"] }
# The high precision reference for log10, pow10, pow and sqrt: correctly
# rounded arbitrary precision, in pure Rust so CI builds no C.
astro-float = "0.9"
# The bindings expose no transcendental call, so the tests run the concrete's
# ABI in their own EVM, the same revm the bindings use.
revm = { version = "36", default-features = false, features = ["std"] }
