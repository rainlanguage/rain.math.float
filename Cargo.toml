[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "LicenseRef-DCL-1.0"
homepage = "https://github.com/rainlanguage/rain.math.float"

# fixed.rs enumerates exp10Fixed's 2^16 cells in big integers: unoptimized
# dependencies make it take two and a half times the CPU in `cargo test`.
[profile.dev.package."*"]
opt-level = 3
