[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "LicenseRef-DCL-1.0"
homepage = "https://github.com/rainlanguage/rain.math.float"
repository = "https://github.com/rainlanguage/rain.math.float"

[workspace.dependencies]
alloy = { version = "1.0.9", default-features = false, features = [
  "sol-types",
  "json",
  "json-abi",
] }
alloy-primitives = "1.0.9"
revm = { version = "41", default-features = false, features = [
  "portable",
  "std",
  "tracer",
] }
thiserror = "2.0.12"
proptest = "1.7.0"
rain-math-float = { path = "crates/float", version = "0.1.10" }
serde = "1.0.219"
serde_json = "1.0.140"
trybuild = "=1.0.115"
wasm-bindgen = "=0.2.122"
